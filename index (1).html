<title>Барыга</title>

<style>
:root {
    --bg: #f2f5f9; --card: #ffffff; --text: #0f172a; --text-sec: #64748b; --primary: #2563eb;
    --primary-light: #eff6ff; --success: #059669; --success-light: #ecfdf5; --danger: #dc2626;
    --border: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
}
body.theme-dubai { --bg: #fdfbf7; --card: #ffffff; --text: #422006; --text-sec: #854d0e; --primary: #d97706; --primary-light: #fef3c7; --success: #16a34a; --success-light: #dcfce7; --border: #fde68a; }
body.theme-london { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --text-sec: #64748b; --primary: #1d4ed8; --primary-light: #dbeafe; --success: #dc2626; --success-light: #fee2e2; --border: #cbd5e1; }

/* СБРОС ВСЕХ ЭФФЕКТОВ НАЖАТИЯ */
* { -webkit-tap-highlight-color: transparent !important; -webkit-focus-ring-color: transparent !important; outline: none !important; }
button, .act-btn, .modal-btn, .bank-btn, .biz-btn, .tab {
    outline: none !important; outline-width: 0 !important; box-shadow: none !important;
    -webkit-appearance: none !important; appearance: none !important; border: none;
    transition: opacity 0.1s;
}
button:focus, button:active, .act-btn:focus, .act-btn:active, .modal-btn:focus, .modal-btn:active,
.bank-btn:focus, .bank-btn:active, .biz-btn:focus, .biz-btn:active, .tab:focus, .tab:active {
    outline: none !important; border: none !important; box-shadow: none !important;
    -webkit-box-shadow: none !important; -moz-box-shadow: none !important; transform: none !important;
}
button:active, .act-btn:active, .modal-btn:active, .bank-btn:active, .biz-btn:active { opacity: 0.7; }

*{margin:0;padding:0;box-sizing:border-box;font-family:'Manrope',-apple-system,sans-serif;user-select:none;}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;transition: background 0.3s;}

.header{background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);z-index:10;}
.logo{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
.header-right{display:flex;gap:8px;align-items:center;}
.location-badge{font-size:12px;font-weight:800;color:var(--primary);background:var(--primary-light);padding:6px 10px;border-radius:10px;border:1px solid var(--primary-light); cursor:pointer;}
.level-badge{font-size:12px;font-weight:800;color:var(--primary);background:var(--primary-light);padding:6px 10px;border-radius:10px;border:1px solid var(--primary-light)}
.wallet{font-size:16px;font-weight:800;color:var(--success);background:var(--success-light);padding:6px 12px;border-radius:10px;}
.bonus-btn{background:#fffbeb;padding:6px 12px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;color:#d97706;border:1px solid #fef3c7}
.prof{background:var(--bg);padding:6px 12px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--text);border:1px solid var(--border)}

.tabs{display:flex;background:var(--card);padding:8px 16px;border-bottom:1px solid var(--border);gap:8px;z-index:9;overflow-x:auto;white-space:nowrap;}
.tab{flex:1;text-align:center;padding:10px 0;font-weight:700;color:var(--text-sec);cursor:pointer;border-radius:10px;font-size:13px;}
.tab.active{background:var(--primary);color:#fff;}

.content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:30px}

.ad-card{background:var(--card);border-radius:16px;padding:16px;display:flex;gap:16px;box-shadow:var(--shadow);border:1px solid var(--border);}
.ad-img{width:70px;height:70px;background:var(--bg);border-radius:12px;display:flex;justify-content:center;align-items:center;flex-shrink:0;overflow:hidden}
.ad-img img{width:100%;height:100%;object-fit:cover;}
.ad-info{flex:1;display:flex;flex-direction:column}
.ad-title{font-size:15px;font-weight:800;margin-bottom:2px}
.ad-price{font-size:17px;font-weight:800;color:var(--primary);margin-bottom:4px}
.ad-desc{font-size:12px;color:var(--text-sec);margin-bottom:12px;font-weight:500}
.ad-actions{display:flex;gap:8px;margin-top:auto}
.act-btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;font-size:13px;cursor:pointer;display:flex;justify-content:center;align-items:center;}
.btn-buy{background:var(--primary);color:#fff}
.btn-chat{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-sell{background:var(--success);color:#fff}
.btn-black{background:#1e293b;color:#fff}

.chat-box{display:flex;flex-direction:column;height:100%;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
.chat-head{padding:16px;background:var(--card);border-bottom:1px solid var(--border);font-weight:800;display:flex;align-items:center;gap:10px;font-size:15px}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;font-weight:500;}
.msg.seller{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px;}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg-time{font-size:10px;opacity:.7;margin-top:4px;display:block;text-align:right}
.chat-input{display:flex;padding:12px;background:var(--card);border-top:1px solid var(--border);gap:8px}
.chat-input input{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:24px;font-size:14px;outline:none;background:var(--bg);font-weight:500}
.chat-input button{background:var(--primary);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:16px;cursor:pointer;}

.chat-list{display:flex;flex-direction:column;gap:8px}
.chat-item{background:var(--card);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--shadow);border:1px solid var(--border)}
.chat-ava{width:44px;height:44px;background:var(--bg);border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:20px}
.chat-name{font-weight:800;font-size:14px;margin-bottom:2px}
.chat-last{font-size:12px;color:var(--text-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;font-weight:500}

.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:100;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:.3s;padding:20px}
.modal.active{opacity:1;pointer-events:all}
.modal-box{background:var(--card);width:100%;max-width:340px;border-radius:24px;padding:24px;text-align:center;max-height:85vh;overflow-y:auto;transform:translateY(20px);transition:.3s;}
.modal.active .modal-box{transform:translateY(0)}
.modal-icon{font-size:48px;margin-bottom:12px}
.modal-title{font-size:20px;font-weight:800;margin-bottom:8px;}
.modal-text{font-size:14px;color:var(--text-sec);margin-bottom:20px;line-height:1.5;font-weight:500}
.modal-input{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--bg);}
.modal-btn{background:var(--primary);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;width:100%;cursor:pointer;margin-bottom:8px;}

.p-stats{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:16px}
.p-row{display:flex;justify-content:space-between;padding:12px 16px;background:var(--bg);border-radius:12px;font-size:13px;font-weight:600;color:var(--text-sec)}
.p-row span:last-child{font-weight:800;color:var(--text)}
.xp-bar-container{background:var(--bg);border-radius:10px;height:12px;width:100%;margin-bottom:16px;overflow:hidden;}
.xp-bar-fill{background:var(--primary);height:100%;width:0%;border-radius:10px;}

.biz-card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.biz-info{display:flex;flex-direction:column;gap:4px;}
.biz-title{font-weight:800;font-size:16px;}
.biz-desc{font-size:12px;color:var(--text-sec);font-weight:500;}
.biz-income{font-size:13px;color:var(--success);font-weight:800;margin-top:4px;}
.biz-btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--success);color:#fff;padding:12px 24px;border-radius:30px;font-weight:800;font-size:14px;box-shadow:0 10px 20px rgba(0,0,0,0.2);opacity:0;transition:all 0.3s;z-index:1000;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

.bank-card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;}
.bank-card h3{font-size:16px;margin-bottom:8px;}
.bank-input{width:100%;padding:10px;margin:8px 0;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);}
.bank-btn{background:var(--primary);color:#fff;border:none;padding:10px;border-radius:10px;font-weight:800;width:100%;margin-top:8px;cursor:pointer;}

.empty{text-align:center;color:var(--text-sec);margin-top:40px;font-weight:600;font-size:14px}

.news-card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;}
.news-title{font-size:16px;font-weight:800;color:var(--primary);margin-bottom:8px;}
.news-item{font-size:14px;color:var(--text-sec);margin-bottom:8px;padding-left:15px;position:relative;line-height:1.4;}
.news-item::before{content:'•';position:absolute;left:0;color:var(--primary);font-weight:900;}

.crypto-graph { width: 100%; height: 100px; background: var(--bg); border-radius: 12px; margin-bottom: 15px; position: relative; overflow: hidden; border: 1px solid var(--border); }
.crypto-line { position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--primary); transition: all 1s linear; }
</style>
</head>
<body>

<div id="loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--card);z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 0.5s;">
    <div style="font-size:30px;font-weight:800;color:var(--primary);margin-bottom:20px;">Барыга</div>

<style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

</div>
</div>
<div class="tabs">
<div class="tab active" onclick="switchTab('buy')">Купить</div>
<div class="tab" onclick="switchTab('sell')">Продать</div>
<div class="tab" onclick="switchTab('chat')">Чаты</div>
<div class="tab" onclick="switchTab('biz')">Бизнес</div>
<div class="tab" onclick="switchTab('black')">🌑</div>
<div class="tab" onclick="switchTab('news')">📰</div>
</div>
<div class="content" id="mainContent"></div>
<div class="modal" id="modal">
<div class="modal-box" id="modalBox">
<div class="modal-icon" id="modalIcon">💬</div>

</div>

function getTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function format(n){return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")}

function updateWallet(){
    const w = document.getElementById('wallet');
    w.innerText = format(money) + ' ₽';
    w.classList.add('bump');
    setTimeout(() => w.classList.remove('bump'), 200);
}

function updateLocationUI() {
    document.getElementById('locationBadge').innerText = '🌍 ' + currentLocation;
    document.body.className = '';
    if (currentLocation === 'Дубай') document.body.classList.add('theme-dubai');
    else if (currentLocation === 'Лондон') document.body.classList.add('theme-london');
}

function openCrypto() {
    document.getElementById('modalIcon').innerText = '📈';
    document.getElementById('modalTitle').innerText = 'Крипто-биржа';
    let html = `
    <div class="bank-card" style="text-align:left;">
        <h3>Барыга-Коин (BARY)</h3>
        <p style="font-size:12px;">Курс: <b id="cryptoPriceDisplay">${format(cryptoPrice)} ₽</b></p>
        <p style="font-size:12px;">Монет: <b>${cryptoCoins}</b></p>
        <p style="font-size:12px;">Ваши монеты: <b style="color:var(--success);">${format(cryptoCoins * cryptoPrice)} ₽</b></p>
        <div class="crypto-graph"><div class="crypto-line" id="cryptoLine" style="height: ${Math.min(cryptoPrice, 100)}%;"></div></div>
        <input type="number" id="cryptoSum" class="bank-input" placeholder="Сумма в ₽">
        <button class="bank-btn" style="background:var(--success);" onclick="buyCrypto()">Купить монеты</button>
        <button class="bank-btn" style="background:var(--danger); margin-top:8px;" onclick="sellCrypto()">Продать всё</button>
    </div>`;
    document.getElementById('modalText').innerHTML = html;
    document.getElementById('modalExtra').innerHTML = '';
    document.getElementById('modalCloseBtn').style.display = 'none';
    document.getElementById('modal').classList.add('active');
}

function buyCrypto() {

    if (!sum || sum <= 0) { showToast('Введите сумму'); return; }

                }, 5000);
            } else if (lower.includes('да') || lower.includes('ок') || lower.includes('переведу')) {
                const stolen = Math.min(money, 1000); money -= stolen; reply = 'Спасибо за перевод! 😂'; chat.status = 'done'; chat.buyerName = '⚠️ Мошенник (кинул)';
                action = function () { updateWallet(); showModal('🚨', 'Вас обманули!', 'Мошенник украл ' + format(stolen) + ' ₽.'); };
            } else reply = 'Ну так что? Переведете за страховку?';
        }
        else if (chat.status === 'negotiation') {
            const item = marketItems.find(i => i.id === chat.itemId);
            if (myOffer) {
                if (myOffer < item.askPrice * 0.6) reply = 'Не интересно.';
                else if (myOffer < item.askPrice * 0.85) reply = 'Маловато. Могу отдать за ' + format(Math.floor(item.askPrice * 0.85)) + ' ₽.';
                else if (money < myOffer) reply = 'У тебя недостаточно средств.';
                else { reply = 'Договорились за ' + format(myOffer) + ' ₽!'; money -= myOffer; inventory.push(Object.assign({}, item, { buyPrice: myOffer })); stats.bought++; chat.status = 'done'; action = function () { updateWallet(); addXp(15); }; }
            } else if (lower.includes('скидк') || lower.includes('дешевл')) reply = 'Могу скинуть до ' + format(Math.floor(item.askPrice * 0.9)) + ' ₽.';
            else reply = 'Какую цену предлагаете?';
        }
        else if (chat.status === 'buy_deal') {
            if (lower.includes('да') || lower.includes('ок') || lower.includes('беру')) {
                if (money < chat.price) reply = 'У тебя недостаточно средств.';
                else { reply = 'Спишем ' + format(chat.price) + ' ₽.'; money -= chat.price; const item = marketItems.find(i => i.id === chat.itemId); inventory.push(Object.assign({}, item, { buyPrice: chat.price })); stats.bought++; chat.status = 'done'; action = function () { updateWallet(); addXp(15); }; }
            } else reply = 'Берете?';
        }
        else if (chat.status === 'active') {
            let currentBotPrice = chat.botOffer || chat.userPrice;
            for (let i = chat.messages.length - 1; i >= 0; i--) { if (chat.messages[i].from === 'seller') { const m = chat.messages[i].text.match(/\d+/g); if (m) { currentBotPrice = parseInt(m.join('')); break; } } }
            
            if (myOffer) {
                if (myOffer > currentBotPrice) reply = 'Дорого. Готов только ' + format(currentBotPrice) + ' ₽.';
                else if (myOffer < chat.buyPrice) reply = 'Это меньше, чем я купил.';
                else {
                    if (chat.isStolen && Math.random() < 0.4) { reply = 'Я в полицию звоню! 🚓'; chat.status = 'done'; action = function () { money -= chat.buyPrice * 2; updateWallet(); showModal('🚓', 'Полиция!', 'Штраф ' + format(chat.buyPrice * 2) + ' ₽.'); }; }
                    else { reply = 'Отлично, по рукам! За ' + format(myOffer) + ' ₽ беру.'; money += myOffer; stats.sold++; stats.profit += (myOffer - chat.buyPrice); stats.deals++; chat.status = 'done'; action = function () { updateWallet(); addXp(25); }; }
                }
            } 
            else if (lower.includes('да') || lower.includes('ок')) {
                if (chat.isStolen && Math.random() < 0.4) { reply = 'Полиция! 🚓'; chat.status = 'done'; action = function () { money -= chat.buyPrice * 2; updateWallet(); showModal('🚓', 'Полиция!', 'Штраф ' + format(chat.buyPrice * 2) + ' ₽.'); }; }
                else { reply = 'Тогда я перевожу ' + format(currentBotPrice) + ' ₽.'; money += currentBotPrice; stats.sold++; stats.profit += (currentBotPrice - chat.buyPrice); stats.deals++; chat.status = 'done'; action = function () { updateWallet(); addXp(25); }; }
            } 
            else reply = 'Какая цена?';
        }
        else if (chat.status === 'done') reply = 'Спасибо за сделку! 🤝';
        if (!reply) reply = 'Я слушаю.';
        chat.messages.push({ from: 'seller', text: reply, time: getTime() });
        const rd = document.createElement('div'); rd.className = 'msg seller'; rd.innerHTML = reply + '<span class="msg-time">' + getTime() + '</span>';
        box.appendChild(rd); box.scrollTop = box.scrollHeight;
        if (action) action();
        if (navigator.vibrate) navigator.vibrate(30);
    }, 1200);
}
function showModal(icon, title, text) { document.getElementById('modalIcon').innerText = icon; document.getElementById('modalTitle').innerText = title; document.getElementById('modalText').innerText = text; document.getElementById('modalExtra').innerHTML = ''; document.getElementById('modalCloseBtn').style.display = 'block'; document.getElementById('modal').classList.add('active'); }
function closeModal() { document.getElementById('modal').classList.remove('active'); renderTab(); }

setInterval(() => {
    let income = 0;
    partners.forEach(p => { income += p.income * p.level; });
    properties.forEach(p => { income += p.income; });
    
    if (income > 0) { money += income; updateWallet(); showToast('+ ' + format(income) + ' ₽ (бизнес и аренда)'); }
    if (deposit > 0) { const interest = Math.floor(deposit * 0.02); deposit += interest; showToast('+' + format(interest) + ' ₽ по вкладу'); }
    if (debt > 0) { debt += Math.floor(debt * 0.05); showToast('⚠️ Долг вырос на 5%!'); }
}, 30000);

function claimBonus() { const now = Date.now(); const last = localStorage.getItem('lastBonusClaim'); if (last && (now - last < 86400000)) { showModal('⏳', 'Уже получено', 'Приходите позже.'); } else { money += 5000; localStorage.setItem('lastBonusClaim', now); updateWallet(); showModal('🎁', 'Ежедневный бонус!', 'Вы получили 5 000 ₽.'); } }

updateWallet(); updateLevelUI(); updateLocationUI();
setTimeout(() => { document.getElementById('loader').style.opacity = '0'; setTimeout(() => document.getElementById('loader').style.display = 'none', 500); renderTab(); }, 1000);
</script>
